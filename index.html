<script>
/* Thème : par défaut le style « carnet de naturaliste » ; sinon un thème de THEMATOR3000 (posé tout de suite, sans clignotement). */
window.THEMES_CLE = "carnet.theme"; window.THEMES_SANS_APPLIQUER = true; window.THEMES_SANS_COMMUN = true;
try { var t = localStorage.getItem("carnet.theme"); if (t && t !== "carnet") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>

<script src="themes.js"></script>
